[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "openengineer"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = ["build123d==0.10.0", "matplotlib==3.11.2", "pydantic==2.12.3", "PyYAML==6.0.3", "ocp-gordon==0.1.17"]

[project.scripts]
openengineer = "openengineer.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.hatch.build.targets.wheel]
packages = ["python/cad-engine/openengineer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
